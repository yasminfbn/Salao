services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salao-app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - mysql
    networks:
      - salao

  nginx:
    image: nginx:latest
    container_name: salao-nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - salao

  mysql:
    image: mysql:8.0
    container_name: salao-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: salao
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: salaoaplicativo
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - salao

volumes:
  mysql_data:

networks:
  salao:
    driver: bridge